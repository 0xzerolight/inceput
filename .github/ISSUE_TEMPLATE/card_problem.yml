name: Card problem
description: Report a wrong sentence, translation, meaning, audio clip or picture on a card.
title: "[Card]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a card. One issue per card, please.

  - type: input
    id: word
    attributes:
      label: Word
      description: The word on the front of the card.
      placeholder: casă
    validations:
      required: true

  - type: dropdown
    id: part
    attributes:
      label: What's wrong
      options:
        - Sentence
        - Sentence translation
        - Meaning
        - Gender, plural or verb forms
        - Word audio
        - Sentence audio
        - Picture
        - Card order
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong, and why.
      placeholder: The translation says "house" but the sentence means "home".
    validations:
      required: true

  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: The correct text, or a better sentence or picture, if you have one.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Deck version
      description: The release you imported, e.g. 1.0.0.
      placeholder: 1.0.0
    validations:
      required: true

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: A screenshot of the card, if it helps.
    validations:
      required: false
